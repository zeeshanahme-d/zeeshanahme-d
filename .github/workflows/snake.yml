# Put this file in your profile repo at:  .github/workflows/snake.yml
# It redraws the snake animation from your contribution graph once a day
# and saves the SVGs to a branch called "output", which the README reads from.

name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (5 AM in Pakistan)
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
